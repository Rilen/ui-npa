<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Conflito controlado mitigado pela ordem de camadas do UI-NPA.">
    <title>Conflito CSS — mitigado</title>
    <link rel="stylesheet" href="./layers.css">
    <link rel="stylesheet" href="./pilot.css">
    <link rel="stylesheet" href="./conflito-legado.css">
    <link rel="stylesheet" href="./.vendor/index.css">
  </head>
  <body class="iui-root">
    <main class="pilot-conflict iui-stack">
      <div class="iui-alert iui-alert--success" role="status">
        <p class="iui-alert__title">Conflito mitigado</p>
        <p>As mesmas regras legadas, em uma camada anterior, preservam o contrato visual dos componentes do UI-NPA.</p>
      </div>
      <h1 class="iui-title">Conflito CSS mitigado</h1>
      <div class="iui-card iui-stack iui-stack--sm">
        <p class="iui-text">Botão, campo, título, link e tabela mantêm o contrato visual do UI-NPA.</p>
        <button class="iui-button iui-button--primary" type="button">Ação primária</button>
        <div class="iui-field">
          <label class="iui-field__label" for="conflito-campo">Campo</label>
          <input class="iui-field__control" id="conflito-campo" type="text" value="Valor de exemplo">
        </div>
        <p><a class="iui-text iui-text--sm iui-text--brand" href="estado-b.html">Voltar ao piloto</a></p>
      </div>
      <div class="iui-table-wrap" role="region" tabindex="0" aria-label="Tabela do conflito mitigado">
        <table class="iui-table">
          <caption class="iui-visually-hidden">Tabela do cenário mitigado</caption>
          <thead>
            <tr><th scope="col">Coluna</th><th scope="col">Valor</th></tr>
          </thead>
          <tbody>
            <tr><td>Exemplo</td><td>Dado fictício</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
